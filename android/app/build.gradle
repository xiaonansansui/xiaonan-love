apply plugin: "com.android.application"

android {
    namespace "com.xiaonan.lovepage"
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaonan.lovepage"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 无需额外依赖，纯 Android SDK 足够
}
